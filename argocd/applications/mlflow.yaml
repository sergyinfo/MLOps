apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: 'https://community-charts.github.io/helm-charts'
    chart: mlflow
    targetRevision: 0.7.1
    helm:
      values: |
        backendStore:
          sharedVolume:
            enabled: false
        extraArgs:
          - --backend-store-uri=postgresql://postgres:password123@postgres-postgresql.mlops.svc.cluster.local:5432/mlflow
          - --default-artifact-root=s3://mlflow-artifacts/
          - --host=0.0.0.0
        service:
          type: ClusterIP
          port: 5000
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true