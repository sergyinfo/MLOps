apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    chart: postgresql
    targetRevision: 14.x.x
    helm:
      values: |
        global:
          imageRegistry: "public.ecr.aws" # <--- БЕЗЛІМІТНЕ ДЗЕРКАЛО AWS
        auth:
          postgresPassword: password123
          database: mlflow
        primary:
          persistence:
            enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true