backendStore:
  sharedVolume:
    enabled: false
extraArgs:
  - "--backend-store-uri=postgresql://postgres:password123@postgres-postgresql.mlops.svc.cluster.local:5432/mlflow"
  - "--default-artifact-root=s3://mlflow-artifacts/"
extraEnvVars:
  "MLFLOW_S3_ENDPOINT_URL": "http://minio.mlops.svc.cluster.local:9000"
  "AWS_ACCESS_KEY_ID": "admin"
  "AWS_SECRET_ACCESS_KEY": "password123"
service:
  type: ClusterIP
  port: 5000
